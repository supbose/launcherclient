<!DOCTYPE html>
<!--
  launcherclient 启动加载页（splash）

  【定位：纯静态 HTML，零 JS、零外部资源】

  它的唯一职责是「消除检测期无界面空档」：manifest 拉取（多地址故障转移，
  最坏 5s×N 个地址）期间若没有任何可显示的界面，用户看到的就是
  「双击图标后什么都没发生」。

  为什么不复用主窗口（App.vue 的 checking 态）：
  - 主窗口是 Vue 应用，要等 WebView 加载完运行时 → 挂载 → 渲染，
    这段几百毫秒的空白正是要消除的对象（与 qsm 的 splash 同理）；
  - splash 不经前端构建产物，Tauri/WebView 拿到 HTML 就能画首帧；
  - 纯 CSS 动画无 JS 开销、零 IPC，不与更新流程抢启动资源。

  创建时机：样式声明在 src-tauri/tauri.conf.json（"create": false，qsm 同款
  配置项），由 lib.rs 的 setup 在直接运行（无 --launch）时按配置构建；
  --launch 交接模式不构建本窗口，全程静默零闪现。
  退出时机：updater.rs 的 run_check —— 发现新版本/出错时先显示主窗口、
  等其首帧渲染后再关闭 splash（qsm show_main_and_close_splash 同款顺序）；
  无更新时补足最短展示时长（1s）后退出。
-->
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <title>更新程序</title>
    <style>
        /* 主题与 src/App.vue 保持一致，避免 splash 与主界面切换时出现风格跳变 */
        :root {
            --accent: #4a9eff;
            --accent-light: #7ab8ff;
            --text: #e8eaf0;
            --text-dim: rgba(232, 234, 240, 0.55);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            /* 与主窗口同款渐变背景（App.vue .updater-root） */
            background: linear-gradient(160deg, #1e2430 0%, #171c26 100%);
            overflow: hidden;
            border: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            user-select: none;
        }

        .splash {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        /* 2x2 方块脉冲。alternate-reverse + 递增长度延迟
           形成对角线流动的错觉，比四块同相位缩放更有生气。 */
        .anim-square-dots {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            width: 44px;
            height: 44px;
        }

        .anim-square-dots span {
            background: var(--accent);
            border-radius: 5px;
            animation: square-dots 0.9s linear 0s infinite alternate-reverse;
        }

        .anim-square-dots span:nth-child(2),
        .anim-square-dots span:nth-child(3) {
            background: var(--accent-light);
        }

        .anim-square-dots span:nth-child(1) {
            animation-delay: 0s;
        }

        .anim-square-dots span:nth-child(2) {
            animation-delay: 0.1s;
        }

        .anim-square-dots span:nth-child(3) {
            animation-delay: 0.2s;
        }

        .anim-square-dots span:nth-child(4) {
            animation-delay: 0.3s;
        }

        @keyframes square-dots {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(0.5);
                opacity: 0.5;
            }
        }

        .hint {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: 0.5px;
        }

        .sub {
            font-size: 11px;
            color: var(--text-dim);
        }
    </style>
</head>

<body>
    <div class="splash">
        <div class="anim-square-dots">
            <span></span><span></span><span></span><span></span>
        </div>
        <div class="hint">正在检查更新…</div>
        <div class="sub">请稍候</div>
    </div>
</body>

</html>
