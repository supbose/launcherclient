# CNB 云原生构建流水线：质量门禁在 push / pull_request 时自动执行，
# 也可以从 main 分支详情页点「发布可信度门禁」按钮手动重跑（按钮定义见 .cnb/web_trigger.yml）。
# 三条事件共用同一份 Pipeline 定义（YAML 锚点 `&quality_gate` / `*quality_gate`），
# 避免自动门禁与手动门禁的检查项悄悄分叉。
#
# 层级是 分支 → 事件 → Pipeline → Stage（串行）；CNB 默认已拉好代码，不需要 checkout 步骤。
#
# 门禁分两档，刻意不是一锅端：
#   硬门禁（失败即红）= 不需要在 Linux 上编译 UI 的检查项
#     · 版本号一致性（package.json 为唯一来源；含两份 Cargo.lock 的本地包版本）
#     · CLI 文档一致性（README / 手册的参数表由 src-core/src/cli.rs 生成）
#     · rustfmt 检查（只看源码，不触发编译，所以 UI crate 也能覆盖）
#     · src-core clippy -D warnings
#     · src-core 单元测试（纯单元、无系统副作用，数量以 CI 输出为准）
#     · src-ui clippy（只依赖 egui 纯 Rust 库，不需要窗口/GPU 系统包，可以硬拦）
#   软门禁（失败只打印，不影响整条流水线结论）= 需要在 Linux 上真的编译 UI 的检查项
#     · src-egui / src-pkgtool 的 clippy
#     原因：eframe/wgpu 在 Linux 要 X11/Wayland 与 OpenSSL 系统包，wgpu 还要求 Vulkan/GL 栈，
#     镜像里缺任何一个都会把流水线变成「和代码无关的红」。这两个 crate 的严格检查
#     请在 Windows 开发机上跑（本地已验证 0 warning），或后续单独配一个带依赖的镜像。
#
# 签名（Authenticode）不在流水线里：需要 .pfx 与时间戳服务，属于发布机的事，
# 见 scripts/pybuild.py 的 --codesign-pfx / --codesign-tsa 与 README §7。
main:
  # 代码推送到 main 时自动执行；锚点定义在这里，下面两个事件直接引用
  push: &quality_gate
    - name: launcherclient-quality-gate
      image: rust:1-bookworm
      stages:
        - name: 准备工具链与系统依赖
          script:
            - rustup component add rustfmt clippy
            # libssl-dev/pkg-config：src-core 的 reqwest 默认走 native-tls，Linux 上要有 OpenSSL 开发头
            - apt-get update -qq
            - apt-get install -y -qq --no-install-recommends ca-certificates pkg-config libssl-dev python3
            - rustc --version && cargo --version && python3 --version

        - name: 版本号一致性（package.json 为唯一来源）
          script:
            # 漂移即失败：Cargo.toml/rc 与 package.json 不同源时，产物「关于」页与 exe 属性会自相矛盾；
            # 同时比对两份 Cargo.lock 的本地包版本（只读解析，不跑 cargo），拦住「清单改了、lock 没提交」
            - python3 scripts/pybuild.py --check-version

        - name: 格式检查（硬门禁）
          script:
            # --all 覆盖 workspace 成员（src-core + src-egui + src-ui）；src-pkgtool 被 workspace 刻意排除，单独查
            - cargo fmt --all -- --check
            - (cd src-pkgtool && cargo fmt --check)

        - name: CLI 文档一致性（硬门禁）
          script:
            # README §4.2 与使用手册 4.1 的用法/参数表由 src-core/src/cli.rs 的 CLI_SPECS 生成；
            # 代码改了文档没重生成时这里会红（本地用 `pnpm docs:cli:sync` 重写）
            - cargo run -q -p qsltd-updater-core --example gen_cli_docs -- --check

        - name: Clippy src-core（硬门禁）
          script:
            # 只编 src-core，不碰 UI crate，因此这条在 Linux 上稳定可复现
            - cargo clippy -p qsltd-updater-core --all-targets -- -D warnings

        - name: Clippy src-ui（硬门禁）
          script:
            # 只依赖 egui（不含 eframe/wgpu），Linux 镜像无需任何图形系统包，稳定可复现
            - cargo clippy -p qsltd-ui --all-targets -- -D warnings

        - name: 单元测试 src-core（硬门禁）
          script:
            # default features 不含 integration：不会去碰 sc.exe / 真实网络
            - cargo test -p qsltd-updater-core

        - name: Clippy src-egui（软门禁）
          script:
            - >-
              cargo clippy -p qsltdupdater-egui --all-targets -- -D warnings
              || echo "[软门禁] src-egui 在 Linux 上编译依赖不全（X11/Wayland/OpenSSL/wgpu），本条不算流水线失败；请在 Windows 开发机执行同样命令确认"

        - name: Clippy src-pkgtool（软门禁）
          script:
            - >-
              (cd src-pkgtool && cargo clippy --all-targets -- -D warnings)
              || echo "[软门禁] src-pkgtool 同上，依赖 egui 渲染栈，Linux 镜像缺系统包时不算流水线失败"

  # PR 创建或更新时自动执行，与 push 使用完全相同的检查项
  pull_request: *quality_gate

  # 按钮触发事件，由 .cnb/web_trigger.yml 的「发布可信度门禁」按钮绑定
  web_trigger_quality_gate: *quality_gate

  # ── Windows 应用打包（仅手动触发，不挂 push / pull_request）──────────────────────────
  # 为什么必须手动：产物是 .exe，且 egui/wgpu 需要 MSVC + Windows SDK 才能编译；
  # CNB 云端只有 Linux 节点，且自托管 Windows Runner 上 Docker 镜像不生效（脚本直接跑在宿主机）。
  # 因此用 runner.tags 把这条流水线调度到「打过 windows 标签的根组织自托管节点」上。
  #
  # 前置：目标 Windows 节点须已安装 Rust（默认 MSVC 目标）、Python 3、git、
  #       Visual Studio 生成工具 / Windows SDK（wgpu 的 d3d12 后端需要；可选用于 Authenticode 签名）。
  # 构建：沿用项目既有打包脚本 scripts/build.py（等价于 `pnpm dist`）——
  #       同步版本号到 Cargo 清单/rc/Cargo.lock → cargo build --release（src-egui 走 workspace、
  #       src-pkgtool 走独立 crate）→ 复制 exe 到 dist/<版本>/。
  # 签名：不传 --codesign-pfx 即完全不签名，与现有约定一致（Authenticode 签名是发布机的事，见 README §7）。
  web_trigger_build_windows:
    - runner:
        # 使用当前仓库所属根组织下的自托管节点
        namespace: group
        # 列出的每个 tag 都必须出现在节点标签上（AND 关系）。
        # 建议节点至少打 windows；灰度可再加 win11 / msvc2022 等更细标签。
        tags:
          - windows
      # ── 缓存策略 ──────────────────────────────────────────────────────────────
      # CNB 原生的 docker.volumes 缓存依赖 Docker，而 Windows 自托管 Runner 上 Docker 不生效、
      # 脚本直接跑在宿主机，故不能用 volumes 做缓存。
      # 改用 sccache：编译产物（.rlib/.o）按「编译器版本 + 源码哈希」落盘到节点本地目录，
      # 重复构建直接命中缓存；它不改变 target/ 路径，因此 pybuild 既有的产物查找逻辑完全不受影响。
      # SCCACHE_DIR 放在仓库目录之外（../...），跨次 git clone 不会被清空、随节点磁盘持久。
      # 节点需能联网完成首次 sccache 安装（之后二进制留在 ~/.cargo/bin 复用，不再重装）。
      env:
        RUSTC_WRAPPER: sccache
        SCCACHE_DIR: ../launcherclient-sccache
        CARGO_INCREMENTAL: "0"
        CARGO_TERM_COLOR: always
      stages:
        - name: 环境自检
          script:
            # Windows 自托管 Runner 的 stage 默认走 PowerShell；ver 是 cmd 内置，用 cmd /c 调用
            - cmd /c ver
            - rustc --version
            - cargo --version
            - python --version
            - git --version

        - name: 准备 sccache 编译缓存
          script:
            # PowerShell 语法：已安装则跳过，否则用 cargo 装一次（结果留在节点，后续复用）
            - if (-not (Get-Command sccache -ErrorAction SilentlyContinue)) { cargo install sccache --locked }

        - name: 运行全量打包脚本（scripts/build.py == pnpm dist）
          script:
            # 不传 --codesign-pfx → 完全不签名，产物与现有本地构建流程一致
            - python scripts/build.py

        - name: 列出产物
          script:
            - cmd /c dir dist

        - name: 打包 dist 为 zip（便于作为单个附件上传）
          script:
            # 宿主 PowerShell 内置 cmdlet；dist/<版本>/ 下的 exe + 字体许可一并打进 dist.zip
            - Compress-Archive -Path dist -DestinationPath dist.zip -Force

        - name: 上传产物到 Commit 附件（CNB OpenAPI，无需 Docker）
          script:
            # 直连 CNB OpenAPI 上传 commit 附件；鉴权用流水线注入的 $env:CNB_TOKEN。
            # 端点遵循 CNB 约定 /api/{slug}/commits/{sha}/attachments（与官方 cnbcool/attachments 插件内部调用一致）。
            # attachment 落到「本次 web_trigger 触发的 commit」上；若想挂到 Release 附件，需先有 tag+release，
            # 并把 $uri 改为 ".../releases/{tag}/attachments"。
            # 若首次返回 404 或报表单字段错误，通常只需核对该路径或下面 -F 的字段名（最可能是 "file="）。
            - >-
              $api = if ($env:CNB_API_ENDPOINT) { $env:CNB_API_ENDPOINT } else { "https://api.cnb.cool" };
              $uri = "$api/api/$($env:CNB_REPO_SLUG)/commits/$($env:CNB_COMMIT)/attachments";
              curl.exe -X POST $uri -H "Authorization: Bearer $($env:CNB_TOKEN)" -H "Accept: application/vnd.cnb.api+json" -F "file=@dist.zip"
          # ── 备选：若 Windows 节点已启用 Docker Desktop（Linux 容器模式），可改用官方插件 ──
          #    → 注释掉上面整段 script，启用下面三行即可（无需自己拼 endpoint）：
          # image: cnbcool/attachments:latest
          # settings:
          #   attachments:
          #     - "./dist.zip"
