[package]
name = "launcherclient"
version = "0.1.0"
description = "QsLtd 独立更新程序 - 无需服务的更新器"
authors = ["supbose <supbose@qq.com>"]
edition = "2021"
license = "MIT"

[lib]
name = "qsltdupdater_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# tauri dev 时 tauri-cli 会加 --no-default-features（走 devUrl 热更）；
# 普通 cargo build/run 含此 feature → 内嵌 frontendDist 资源，窗口不依赖 vite
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
# 统一能力库（自有封装）：update 模块提供 LocalManifest 本地版本记录与 get_myapp_dir
qingshu = { path = "../../../qingshu.work/rust/qingshu", features = ["update"] }
# 共享核心：cli/config/manifest/download/install/cleanup/services（无 UI）
qsltd-updater-core = { path = "../src-core" }

[lints.rust]
unused_imports = "allow"
unused_variables = "allow"
dead_code = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
print_stdout = "warn"

[profile.dev]
debug = true
opt-level = 0

[profile.release]
opt-level = 3
lto = true
