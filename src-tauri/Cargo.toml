[package]
name = "qsltdupdater"
version = "0.1.0"
description = "QsLtd 独立更新程序 - 无需服务的更新器"
authors = ["supbose <supbose@qq.com>"]
edition = "2021"
license = "MIT"

[lib]
name = "qsltdupdater_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
semver = "1"
# 下载与安装
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
zip = "2"
# 独立更新核心库（qcsm 派生版，无需服务）：复用 LocalManifest 本地版本记录
qsltd-update = { path = "../../cargo-project/qsltd-update" }

[lints.rust]
unused_imports = "allow"
unused_variables = "allow"
dead_code = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
print_stdout = "warn"
unused_imports = "allow"
unused_variables = "allow"
dead_code = "allow"

[profile.dev]
debug = true
opt-level = 0

[profile.release]
opt-level = 3
lto = true
