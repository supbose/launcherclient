[package]
name = "qsltd-updater-core"
version = "0.1.0"
description = "QsLtd 独立更新程序 - 共享核心模块（无 UI）"
authors = ["supbose <supbose@qq.com>"]
edition = "2021"
license = "MIT"

[features]
# 默认 cargo test 只跑纯单元测试（无系统副作用）；
# 真实 sc.exe 冒烟测试需显式开启：cargo test --features integration（需管理员权限）
default = []
integration = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
semver = "1"
# 下载与安装
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
zip = "2"
# 统一能力库（自有封装）：update 模块提供 LocalManifest 本地版本记录与 get_myapp_dir
qingshu = { path = "../../../qingshu.work/rust/qingshu", features = ["update"] }

# 注意：unused_imports / unused_variables / dead_code 是 rustc lint，
# 必须放在 [lints.rust]；放进 [lints.clippy] 会触发 unknown lint 警告且不生效
[lints.rust]
unused_imports = "allow"
unused_variables = "allow"
dead_code = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
print_stdout = "warn"
