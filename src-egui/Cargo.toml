[package]
name = "qsltdupdater-egui"
# 版本与 edition/license/authors 继承根 workspace 的 [workspace.package]；
# 构建 profile 也在根 Cargo.toml（workspace 成员不能各自定义）
# 继承需按字段逐个声明，缺 edition 会退回 2015
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "QsLtd 独立更新程序（egui/eframe 原生 UI 版）"

[[bin]]
name = "launcherclient"
path = "src/main.rs"

[dependencies]
# egui/eframe 原生 UI 框架。兼容优先：保留 wgpu 渲染后端（DX12/WARP，不依赖 GL 驱动），
# 只关掉用不到的默认 feature，减小体积：
# - default_fonts：字体由 src-ui 的 install_fonts 从系统字体加载（关闭后必须显式建字族）
# - accesskit / clipboard / links / system_fonts / web_screen_reader / wayland / x11：
#   本项目不用的辅助能力（x11/wayland 仅 Linux 生效）
eframe = { version = "0.37", default-features = false, features = ["wgpu"] }
egui = "0.37"
# PNG 解码：assets/icon.png → egui::IconData（窗口/任务栏图标）
png = "0.17"
# 只用运行时/文件/流/定时器，避免 tokio "full" 带入未使用的 net/process/signal 等
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "time"] }
# 共享核心：cli/config/manifest/download/install/cleanup/services + phase/flow（无 UI）
# 应用目录与本地版本记录（原外部 qingshu 能力）已内聚到 src-core 的 appdir / local_manifest
qsltd-updater-core = { path = "../src-core" }
# 共享 UI 原语（主题/标题栏/spinner/进度条），src-pkgtool 用的也是这份
qsltd-ui = { path = "../src-ui" }

[build-dependencies]
# Windows exe 图标资源嵌入（调用系统 rc.exe；非 Windows 平台自动跳过）
embed-resource = "3"

[lints.rust]
unused_imports = "allow"
unused_variables = "allow"
dead_code = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
print_stdout = "warn"
