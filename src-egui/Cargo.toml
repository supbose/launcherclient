[package]
name = "qsltdupdater-egui"
version = "0.1.8"
description = "QsLtd 独立更新程序（egui/eframe 原生 UI 版）"
authors = ["supbose <supbose@qq.com>"]
edition = "2021"
license = "MIT"

[[bin]]
name = "launcherclient"
path = "src/main.rs"

[dependencies]
# egui/eframe 原生 UI 框架（默认 feature 即走 wgpu 渲染后端，与 0.35 一致）
eframe = "0.37"
egui = "0.37"
# PNG 解码：assets/icon.png → egui::IconData（窗口/任务栏图标）
png = "0.17"
tokio = { version = "1", features = ["full"] }
# 共享核心：cli/config/manifest/download/install/cleanup/services + phase/flow（无 UI）
# 应用目录与本地版本记录（原外部 qingshu 能力）已内聚到 src-core 的 appdir / local_manifest
qsltd-updater-core = { path = "../src-core" }

[build-dependencies]
# Windows exe 图标资源嵌入（调用系统 rc.exe；非 Windows 平台自动跳过）
embed-resource = "3"

[lints.rust]
unused_imports = "allow"
unused_variables = "allow"
dead_code = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
print_stdout = "warn"

[profile.dev]
debug = true
opt-level = 0

[profile.release]
opt-level = 3
lto = true
# 剥离调试符号与 panic 位置信息：减小体积、降低杀软启发式误报率（对齐原 Tauri 版的既有约定）
strip = true
codegen-units = 1
