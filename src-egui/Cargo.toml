[package]
name = "qsltdupdater-egui"
# 版本与 edition/license/authors 继承根 workspace 的 [workspace.package]；
# 构建 profile 也在根 Cargo.toml（workspace 成员不能各自定义）
# 继承需按字段逐个声明，缺 edition 会退回 2015
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "QsLtd 独立更新程序（egui/eframe 原生 UI 版）"

[[bin]]
name = "launcherclient"
path = "src/main.rs"

[dependencies]
# egui/eframe 原生 UI 框架（默认 feature 即走 wgpu 渲染后端，与 0.35 一致）
eframe = "0.37"
egui = "0.37"
# PNG 解码：assets/icon.png → egui::IconData（窗口/任务栏图标）
png = "0.17"
tokio = { version = "1", features = ["full"] }
# 共享核心：cli/config/manifest/download/install/cleanup/services + phase/flow（无 UI）
# 应用目录与本地版本记录（原外部 qingshu 能力）已内聚到 src-core 的 appdir / local_manifest
qsltd-updater-core = { path = "../src-core" }

[build-dependencies]
# Windows exe 图标资源嵌入（调用系统 rc.exe；非 Windows 平台自动跳过）
embed-resource = "3"

[lints.rust]
unused_imports = "allow"
unused_variables = "allow"
dead_code = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
print_stdout = "warn"
