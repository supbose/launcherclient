[package]
name = "qsltdupdater-egui"
version = "0.1.8"
description = "QsLtd 独立更新程序（egui/eframe 原生 UI 版）"
authors = ["supbose <supbose@qq.com>"]
edition = "2021"
license = "MIT"

[[bin]]
name = "qsltdupdater-egui"
path = "src/main.rs"

[dependencies]
# egui/eframe 原生 UI 框架（glow 渲染后端，默认 feature 即可）
eframe = "0.35"
egui = "0.35"
tokio = { version = "1", features = ["full"] }
# 统一能力库（自有封装）：update 模块提供 LocalManifest 本地版本记录与 get_myapp_dir
qingshu = { path = "../../../qingshu.work/rust/qingshu", features = ["update"] }
# 共享核心：cli/config/manifest/download/install/cleanup/services + phase/flow（无 UI）
qsltd-updater-core = { path = "../src-core" }

[lints.rust]
unused_imports = "allow"
unused_variables = "allow"
dead_code = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
print_stdout = "warn"

[profile.dev]
debug = true
opt-level = 0

[profile.release]
opt-level = 3
lto = true
# 剥离调试符号与 panic 位置信息：减小体积、降低杀软启发式误报率（对齐 src-tauri）
strip = true
codegen-units = 1
