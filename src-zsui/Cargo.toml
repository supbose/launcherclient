[package]
name = "qsltdupdater-zsui"
version = "0.1.0"
description = "QsLtd 独立更新程序（zsui 原生 UI 版）"
authors = ["supbose <supbose@qq.com>"]
edition = "2021"
license = "MIT"

[[bin]]
name = "qsltdupdater-zsui"
path = "src/main.rs"

[dependencies]
# zsui 原生 UI 框架（本机 0.3.0-alpha.1 源码；crates.io 尚未发布该版本）
zsui = { path = "../../zsui", features = ["window", "label", "button", "progress", "badge"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
# 独立更新核心库（qcsm 派生版，无需服务）：复用 LocalManifest 本地版本记录
qingshu = { path = "../../../qingshu.work/rust/qingshu", features = ["update"] }
# 共享核心：cli/config/manifest/download/install/cleanup/services（无 UI）
qsltd-updater-core = { path = "../src-core" }

[lints.rust]
unused_imports = "allow"
unused_variables = "allow"
dead_code = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
print_stdout = "warn"
unused_imports = "allow"
unused_variables = "allow"
dead_code = "allow"

[profile.dev]
debug = true
opt-level = 0

[profile.release]
opt-level = 3
lto = true
